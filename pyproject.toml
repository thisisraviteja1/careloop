[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careloop"
version = "0.0.1"
description = "Routine-aware check-ins for older adults living alone, built on Ring events and Amazon Bedrock."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "contrib"]  # contrib/ follows the upstream repo's style

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"backend/app/ai/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
